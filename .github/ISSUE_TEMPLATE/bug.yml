name: Bug
description: Report a reproducible problem
title: "Bug: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App version, platform and impact
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics and screenshots
      description: Remove personal data, credentials and private journal content.
