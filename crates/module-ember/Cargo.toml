[package]
name = "tauri-plugin-ember"
description = "Unhollowed module adapter for Ember: registers Ember's own commands behind the host contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "tauri-plugin-ember"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde_json = { workspace = true }
unhlw-host-contract = { path = "../host-contract" }
unhlw-data-safety = { path = "../data-safety" }
# Ember's own library (habits, storage, backup, shared commands). `npm run build:modules` clones Ember at the
# commit pinned in modules.json (manifests verified) into .modules/ember; no code is copied.
ember-by-arlecchino = { path = "../../.modules/ember/desktop/src-tauri", default-features = false }
