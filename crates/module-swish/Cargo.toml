[package]
name = "tauri-plugin-swish"
description = "Unhollowed module adapter for Swish: registers Swish's own commands behind the host contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "tauri-plugin-swish"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde_json = { workspace = true }
unhlw-host-contract = { path = "../host-contract" }
unhlw-data-safety = { path = "../data-safety" }
# Swish's own library (storage, data commands, backup and restore). `npm run build:modules` clones Swish at the
# commit pinned in modules.json (manifests verified) into .modules/swish; no code is copied. A git dependency
# is not used: Cargo would also fetch Swish's private Core submodule, which it cannot authenticate.
swish = { path = "../../.modules/swish/src-tauri", default-features = false }
# The error type the module reports through (Swish's own crate, the same checkout).
swish-data = { path = "../../.modules/swish/src-tauri/data" }
