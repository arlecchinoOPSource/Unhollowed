[package]
name = "unhollowed"
description = "Unhollowed: one desktop host for Terminal, Ember and Swish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "unhollowed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unhlw-host-contract = { path = "../crates/host-contract" }
unhlw-data-safety = { path = "../crates/data-safety" }
tauri-plugin-swish = { path = "../crates/module-swish" }
tauri-plugin-terminal = { path = "../crates/module-terminal" }
tauri-plugin-ember = { path = "../crates/module-ember" }
tauri-plugin-dialog = { workspace = true }

[features]
# Serve the embedded frontend instead of the dev server (used by tauri build and the native self-test).
custom-protocol = ["tauri/custom-protocol"]
