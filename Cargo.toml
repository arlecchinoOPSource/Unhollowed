[workspace]
members = ["src-tauri", "crates/host-contract", "crates/module-swish", "crates/module-terminal", "crates/module-ember"]
exclude = [".modules"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# One version of each shared dependency for every module (see docs/DEPENDENCY-ALIGNMENT-U32.md).
[workspace.dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin = { version = "2.7.2", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
